name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: python -m pip install -r requirement.txt

      - name: Validate Python files
        run: python -m py_compile app.py house.py

      - name: Create test report directory
        run: mkdir -p test-results

      - name: Run tests
        run: >-
          pytest test_app_50_cases.py -v -ra
          --junitxml=test-results/junit.xml
          --html=test-results/unit-test-report.html
          --self-contained-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --file dockerfile --tag house-predict:${{ github.sha }} .